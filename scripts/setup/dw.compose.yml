# Per-worktree infra stack for `bun dw`.
# Project name is set per-worktree via COMPOSE_PROJECT_NAME (e.g. autumn-wt-8).
# Public URLs are a host ngrok tunnel to the path proxy, not compose services.

services:
  kafka:
    extends:
      file: ../../docker/kafka.compose.yml
      service: kafka
    container_name: ${COMPOSE_PROJECT_NAME}-kafka
    restart: unless-stopped

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: ${COMPOSE_PROJECT_NAME}-dragonfly
    ports:
      - "${DRAGONFLY_PORT}:6379"
    ulimits:
      memlock: -1
    restart: unless-stopped

  # Local SQS and EventBridge Scheduler, pinned to a release and its digest. Why it replaced ElasticMQ, how it
  # is locked down and how to upgrade it: scripts/dw/README.md. Never mount the Docker socket into it.
  fakecloud:
    image: ghcr.io/faiscadev/fakecloud:0.45.0@sha256:78844f091be86081d3d11b056e3d56e6ea0ace4ce607e55fa4255fc759d39279
    container_name: ${COMPOSE_PROJECT_NAME}-fakecloud
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${FAKECLOUD_PORT}:4566"
    environment:
      FAKECLOUD_REGION: us-east-2
      FAKECLOUD_ACCOUNT_ID: "123456789012"
    healthcheck:
      test: ["CMD", "fakecloud", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: ${COMPOSE_PROJECT_NAME}-dynamodb
    ports:
      - "${DYNAMODB_PORT}:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped

volumes:
  kafka-data:
