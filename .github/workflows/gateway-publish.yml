name: Gateway Publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/gateway/**"

  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no actual publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  publish:
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      id-token: write
      contents: write
    with:
      package-dir: packages/gateway
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
