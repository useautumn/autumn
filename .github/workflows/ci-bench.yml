name: CI Bench (Peak vs Blacksmith)

on:
  push:
    branches:
      - "ci-bench/**"

permissions:
  contents: read

concurrency:
  group: ci-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: arch r${{ matrix.round }} ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { round: 1, provider: x64, runner: peak-ubuntu-24.04-8 }
          - { round: 1, provider: arm, runner: peak-ubuntu-24.04-arm-8 }
          - { round: 2, provider: arm, runner: peak-ubuntu-24.04-arm-8 }
          - { round: 2, provider: x64, runner: peak-ubuntu-24.04-8 }
          - { round: 3, provider: x64, runner: peak-ubuntu-24.04-8 }
          - { round: 3, provider: arm, runner: peak-ubuntu-24.04-arm-8 }
          - { round: 4, provider: arm, runner: peak-ubuntu-24.04-arm-8 }
          - { round: 4, provider: x64, runner: peak-ubuntu-24.04-8 }

    steps:
      - name: Hardware fingerprint
        run: |
          uname -m
          lscpu | grep -E "Model name|^CPU\(s\)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun ts

      - name: Run unit tests
        run: bun run test:unit
        working-directory: server
