name: CI Bench (Peak vs Blacksmith)

on:
  push:
    branches:
      - "ci-bench/**"

permissions:
  contents: read

concurrency:
  group: ci-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: knip r${{ matrix.round }} ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { round: 1, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 1, provider: peak, runner: peak }
          - { round: 2, provider: peak, runner: peak }
          - { round: 2, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 3, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 3, provider: peak, runner: peak }
          - { round: 4, provider: peak, runner: peak }
          - { round: 4, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 5, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 5, provider: peak, runner: peak }
          - { round: 6, provider: peak, runner: peak }
          - { round: 6, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 7, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 7, provider: peak, runner: peak }
          - { round: 8, provider: peak, runner: peak }
          - { round: 8, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 9, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { round: 9, provider: peak, runner: peak }
          - { round: 10, provider: peak, runner: peak }
          - { round: 10, provider: blacksmith, runner: blacksmith-4vcpu-ubuntu-2404 }

    steps:
      - name: Hardware fingerprint
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          free -g | head -2
          dd if=/dev/zero of=/tmp/ddtest bs=1M count=512 oflag=direct 2>&1 | tail -1
          rm -f /tmp/ddtest

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Knip
        run: bun knip
