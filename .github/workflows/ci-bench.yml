name: CI Bench (Peak vs Blacksmith)

on:
  push:
    branches:
      - "ci-bench/**"

permissions:
  contents: read

concurrency:
  group: ci-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck r${{ matrix.round }} ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { round: 1, provider: blacksmith, runner: blacksmith-8vcpu-ubuntu-2404 }
          - { round: 1, provider: peak, runner: peak-x64-8 }
          - { round: 2, provider: peak, runner: peak-x64-8 }
          - { round: 2, provider: blacksmith, runner: blacksmith-8vcpu-ubuntu-2404 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun ts

  docker:
    name: docker ${{ matrix.provider }} (round ${{ matrix.round }})
    needs: typecheck
    if: always()
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { round: 1, provider: blacksmith, runner: blacksmith-16vcpu-ubuntu-2404 }
          - { round: 1, provider: peak, runner: peak-x64-16 }
          - { round: 2, provider: peak, runner: peak-x64-16 }
          - { round: 2, provider: blacksmith, runner: blacksmith-16vcpu-ubuntu-2404 }

    steps:
      - name: Hardware fingerprint
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          free -g | head -2
          df -h / | tail -1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Blacksmith Docker builder
        if: matrix.provider == 'blacksmith'
        uses: useblacksmith/setup-docker-builder@v1

      - name: Use Peak Docker builder
        if: matrix.provider == 'peak'
        run: docker buildx use default

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            -f docker/Dockerfile \
            .
