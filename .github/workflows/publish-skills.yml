name: Publish Public Skills

on:
  push:
    branches:
      - dev
    paths:
      - "apps/docs/mintlify/**"
      - "packages/agent-docs/agent-docs.config.ts"
      - "packages/agent-docs/content/**"
      - "packages/agent-docs/scripts/**"
      - "packages/agent-docs/src/translate/**"
      - "packages/agent-docs/package.json"
      - ".github/workflows/publish-skills.yml"
  workflow_dispatch:

concurrency:
  group: publish-public-skills
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Autumn
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate and validate skills
        run: |
          bun -F @autumn/agent-docs gen
          bun -F @autumn/agent-docs skills:check

      - name: Checkout skills repository
        uses: actions/checkout@v4
        with:
          repository: useautumn/skills
          ref: master
          ssh-key: ${{ secrets.SKILLS_REPO_DEPLOY_KEY }}
          path: skills-repository

      - name: Mirror generated skills
        run: |
          bun -F @autumn/agent-docs skills:mirror \
            "$GITHUB_WORKSPACE/skills-repository" \
            "$GITHUB_SHA"

      - name: Smoke install autumn-setup
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npx --yes --package skills@1.5.23 skills add \
            "$GITHUB_WORKSPACE/skills-repository" \
            --skill autumn-setup \
            --agent claude-code \
            --copy \
            --yes
          [ -f ".claude/skills/autumn-setup/SKILL.md" ]

      - name: Publish changed skills
        working-directory: skills-repository
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Public skills are already current."
            exit 0
          fi

          git config user.name "autumn-skills-bot"
          git config user.email "bot@useautumn.com"
          git add skills generated-manifest.json
          git commit -m "sync public skills from autumn@${SOURCE_SHA::12}"
          git push origin HEAD:master
