name: Server Type Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Check changed files
    runs-on: peak-ubuntu-24.04-4
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      # Generated code is produced on main by publish.yml; sync PRs from main and the bot are exempt.
      - name: Checkout generated-paths list
        if: github.base_ref == 'dev' && github.head_ref != 'main' && !startsWith(github.head_ref, 'sync/') && github.event.pull_request.user.login != 'autumn-codegen[bot]'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts/release
            packages/sdk/.speakeasy
            others/python-sdk/.speakeasy
            apps/docs/mintlify/api-reference

      - name: Set up Bun
        if: github.base_ref == 'dev' && github.head_ref != 'main' && !startsWith(github.head_ref, 'sync/') && github.event.pull_request.user.login != 'autumn-codegen[bot]'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Block edits to generated paths
        if: github.base_ref == 'dev' && github.head_ref != 'main' && !startsWith(github.head_ref, 'sync/') && github.event.pull_request.user.login != 'autumn-codegen[bot]'
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bun test check-generated-paths.test.ts
          bun check-generated-paths.ts

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050
        with:
          filters: |
            server:
              - "server/**"
              - "shared/**"
              - "**/package.json"
              - "bun.lock"
              - ".github/scripts/check-workspaces.ts"
              - ".github/workflows/server-typecheck.yml"

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: peak-ubuntu-24.04-4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Check workspace list
        working-directory: .github/scripts
        run: bun check-workspaces.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: cd server && bun ts
