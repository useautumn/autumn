name: Bump autumn-js

# server and billing pin autumn-js from npm. bun's minimumReleaseAge gate means a release is
# only installable days after publish, so poll daily for the newest eligible version.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Branch to bump"
        required: false
        default: dev
        type: string
      dry-run:
        description: "Report the bump without pushing or opening a PR"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: bump-autumn-js
  cancel-in-progress: false

jobs:
  bump:
    name: Bump autumn-js pin
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      BASE: ${{ inputs.base || 'dev' }}
      BUMP_BRANCH: bot/bump-autumn-js
      DRY_RUN: ${{ inputs.dry-run || 'false' }}
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODEGEN_APP_ID || secrets.CODEGEN_APP_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Checkout ${{ env.BASE }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Pick newest eligible autumn-js
        id: pin
        run: bun scripts/release/pinAutumnJs.ts "$GITHUB_WORKSPACE"

      - name: Update lockfile
        if: steps.pin.outputs.version != ''
        run: |
          bun install --lockfile-only
          git diff --stat

      - name: Open or update bump PR
        if: steps.pin.outputs.version != ''
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          EXISTING=$(gh pr list --head "$BUMP_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would ${EXISTING:+update #}${EXISTING:-open a PR} on ${BUMP_BRANCH} into ${BASE} bumping autumn-js to ${VERSION}."
            exit 0
          fi
          BOT_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BUMP_BRANCH"
          git commit -am "chore: bump autumn-js to ${VERSION}"
          git push --force origin "$BUMP_BRANCH"
          TITLE="chore: bump autumn-js to ${VERSION}"
          BODY="Pins \`autumn-js@${VERSION}\`, the newest release past bun's \`minimumReleaseAge\`, in \`server\` and \`packages/billing\`, and updates \`bun.lock\`."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base "$BASE" --head "$BUMP_BRANCH" --title "$TITLE" --body "$BODY"
          fi
