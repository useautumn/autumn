name: ATMN Publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/atmn/**"
      - "packages/atmn-generator/**"
      - "packages/agent-docs/**"
      - "packages/openapi/openapi*.yml"

  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no actual publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      version-bump:
        description: "Version bump type (for manual triggers)"
        required: false
        default: "patch"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"

jobs:
  publish:
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      id-token: write
      contents: write
    with:
      package-dir: packages/atmn
      pre-build-command: bun -F @autumn/agent-docs gen && bun -F @autumn/atmn-generator generate
      commit-paths: packages/atmn packages/atmn-generator packages/agent-docs packages/openapi
      minimum-package-version: true
      version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version-bump || '' }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
