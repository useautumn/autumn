name: Release Impact

on:
  # _target so fork PRs get a checks:write token; it only runs after merge, on the base branch's code.
  pull_request_target:
    types: [closed]
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      pr:
        description: "Merged PR number to (re)compute impact for"
        required: true
        type: string

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: release-impact-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  impact:
    name: Release impact
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Resolve merge commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.merged_at != null) | .merge_commit_sha')
          if [ -z "$merge_sha" ]; then
            echo "::error::PR #$PR_NUMBER is not merged"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "commit_count=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .commits)" >> "$GITHUB_OUTPUT"

      # Checks out the workflow's own ref so the impact script exists even when
      # backfilling a PR merged before it was added.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Regenerated from source: the committed yml only refreshes when someone runs `bun api`.
      - name: Generate specs before and after the PR
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          COMMIT_COUNT: ${{ steps.pr.outputs.commit_count }}
        run: |
          set -euo pipefail
          cp scripts/release/releaseImpact.ts scripts/release/diffOpenApiOperations.ts "$RUNNER_TEMP/"
          # Rebase merges land several PR commits, so walk back past every one the PR owns.
          base_sha=$(git rev-parse "$MERGE_SHA^1")
          for _ in $(seq "$COMMIT_COUNT"); do
            owned=$(gh api "repos/$GITHUB_REPOSITORY/commits/$base_sha/pulls" --jq "any(.[]; .number == $PR_NUMBER)")
            [ "$owned" = true ] || break
            base_sha=$(git rev-parse "$base_sha^1")
          done
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          for side in base head; do
            sha=$base_sha
            if [ "$side" = head ]; then sha=$MERGE_SHA; fi
            git checkout -q -f "$sha"
            bun install --frozen-lockfile
            (cd packages/openapi && bun api.ts --spec-only)
            mkdir -p "$RUNNER_TEMP/spec-$side"
            cp packages/openapi/openapi.yml packages/openapi/openapi-internal.yml "$RUNNER_TEMP/spec-$side/"
          done

      - name: Compute impact
        env:
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bun "$RUNNER_TEMP/releaseImpact.ts" \
            --base-sha "$BASE_SHA" --head-sha "$MERGE_SHA" \
            --base-dir "$RUNNER_TEMP/spec-base" --head-dir "$RUNNER_TEMP/spec-head" \
            > "$RUNNER_TEMP/impact.json"
          jq . "$RUNNER_TEMP/impact.json"

      # Consumers (infra /released) read `output.text` of this check-run as JSON.
      - name: Publish check-run
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          impact="$RUNNER_TEMP/impact.json"
          affected=$(jq -r '[.targets | to_entries[] | select(.value.affected) | .key] | join(", ")' "$impact")
          title="Affects: ${affected:-nothing releasable}"
          summary=$(jq -r --arg pr "$PR_NUMBER" '
            "PR #\($pr)\n\n" +
            ([.targets | to_entries[] | "- **\(.key)**: \(if .value.affected then (.value.reasons | join("; ")) else "no change" end)"] | join("\n")) +
            "\n\n" +
            ([.operations.public | to_entries[] | .key as $kind | .value[] | "- \($kind): `\(.key)`"] | join("\n"))
          ' "$impact")
          jq -n \
            --arg sha "$MERGE_SHA" \
            --arg title "$title" \
            --arg summary "$summary" \
            --rawfile text "$impact" \
            '{name: "Release impact", head_sha: $sha, status: "completed", conclusion: "neutral",
              output: {title: $title, summary: $summary, text: $text}}' \
            > "$RUNNER_TEMP/check-run.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/check-run.json" --jq .html_url
