name: tw Unit Tests

on:
  pull_request:
    paths:
      - "scripts/tw/**"
      - "server/tests/**"
      - ".github/workflows/tw-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: tw Unit Tests
    runs-on: peak-ubuntu-24.04-4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tw helper tests
        run: bun test tw/helpers
        working-directory: scripts
