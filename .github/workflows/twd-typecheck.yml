name: twd Type Check

on:
  pull_request:
    # twd's typecheck follows its imports into scripts/tw, server and shared.
    paths:
      - "apps/twd/**"
      - "scripts/tw/**"
      - "server/src/**"
      - "shared/**"
      - "packages/ui/**"
      - "bun.lock"
      - ".github/workflows/twd-typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: twd Type Check
    runs-on: peak-ubuntu-24.04-4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check server
        working-directory: apps/twd
        run: bun run ts

      - name: Type check web
        working-directory: apps/twd
        run: bunx tsgo --noEmit -p web/tsconfig.json
