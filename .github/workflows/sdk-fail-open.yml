name: SDK Fail-Open Contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdk-fail-open:
    name: SDK Fail-Open Contract
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test fail-open contracts
        working-directory: packages/sdk
        run: bun test test/fail-open.test.ts
