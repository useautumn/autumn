name: Generate API Docs PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: generate-api-docs-pr
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate API reference and docs snippets
        run: bun api --docs-only

      - name: Open or update generated docs PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          base: main
          branch: automation/generated-api-docs
          add-paths: apps/docs/mintlify/**
          commit-message: "docs: refresh generated API reference"
          title: "docs: refresh generated API reference (manual merge required)"
          body: |
            Regenerates the API reference and documentation snippets from `main` using `bun api --docs-only`.

            Review and merge this PR manually to let Mintlify deploy the updated docs.
            This workflow does not publish SDKs, push to `main`, or enable auto-merge.
