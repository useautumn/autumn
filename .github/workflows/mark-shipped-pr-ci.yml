name: Mark Shipped PR CI

on:
  check_suite:
    types:
      - completed

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  mark-ci-passed:
    name: Mark shipped PR CI passed
    if: github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Mark the shipped message when every check has passed
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::DEPLOY_URL and DEPLOY_SECRET must be configured"
            exit 1
          fi

          pr_number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .head.repo.full_name == env.GITHUB_REPOSITORY)][0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No same-repository PR to main is associated with this check suite"
            exit 0
          fi

          check_runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
            --header 'Accept: application/vnd.github+json' \
            --jq '.check_runs')
          if [ "$(printf '%s' "$check_runs" | jq 'length')" -eq 0 ] ||
            ! printf '%s' "$check_runs" | jq -e \
              'all(.[]; .status == "completed" and (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral"))' \
              > /dev/null; then
            echo "PR checks are not all passing yet"
            exit 0
          fi

          combined_status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" \
            --jq '{ state, total_count }')
          if ! printf '%s' "$combined_status" | jq -e \
            '.total_count == 0 or .state == "success"' > /dev/null; then
            echo "Combined commit status is not successful yet"
            exit 0
          fi

          pr_url="https://github.com/$GITHUB_REPOSITORY/pull/$pr_number"
          export pr_url
          node -e 'process.stdout.write(JSON.stringify({ pullRequestUrl: process.env.pr_url }))' \
            > "$RUNNER_TEMP/shipped-ci-payload.json"

          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-deploy-secret: $DEPLOY_SECRET" \
            --data-binary @"$RUNNER_TEMP/shipped-ci-payload.json" \
            "$DEPLOY_URL/api/shipped/ci"
