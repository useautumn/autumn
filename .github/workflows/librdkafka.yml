name: librdkafka

on:
  pull_request:
    paths:
      - "packages/librdkafka/**"
      - "patches/@confluentinc%2Fkafka-javascript@*.patch"
      - "docker/Dockerfile"
      - ".github/workflows/librdkafka.yml"
  push:
    branches: [dev]
    paths:
      - "packages/librdkafka/**"
      - "patches/@confluentinc%2Fkafka-javascript@*.patch"
      - "docker/Dockerfile"
      - ".github/workflows/librdkafka.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: librdkafka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and load the addon
    runs-on: peak-ubuntu-24.04-4
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The build key hashes the patched sources and this runner's glibc and compiler.
      - name: Name the addon build
        id: native-key
        run: echo "key=$(bun run --silent --cwd packages/librdkafka native:key)" >> "$GITHUB_OUTPUT"

      - name: Restore the compiled addon
        uses: actions/cache@v4
        with:
          path: ~/.cache/autumn-librdkafka
          key: librdkafka-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-key.outputs.key }}

      - name: Build the addon
        run: bun run --cwd packages/librdkafka build

      - name: Unit tests
        run: bun -F @autumn/librdkafka test:unit

      - name: The addon loads under Bun
        run: bun -F @autumn/librdkafka test:native

      - name: Type check
        run: bun -F @autumn/librdkafka ts

  image:
    name: Build the deploy image and probe the addon in it
    # Same runner class and Blacksmith builder as build.yml, so a compile here warms the deploy's cache mount.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Start a Kafka broker
        run: docker run -d --name kafka --network host apache/kafka:3.9.1

      - name: Build the image
        shell: bash
        run: |
          started=$(date +%s)
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --progress=plain \
            --load \
            --tag autumn:librdkafka-probe \
            -f docker/Dockerfile \
            . 2>&1 | tee /tmp/image-build.log
          seconds=$(( $(date +%s) - started ))
          outcome=$(grep -oE "native addon (current|restored|built) in [0-9.]+s" /tmp/image-build.log || echo "native stage layer cached")
          echo "Image built in ${seconds}s; ${outcome}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for the broker
        run: |
          for _ in $(seq 60); do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs kafka
          exit 1

      - name: Create a topic and send idempotently from the image
        shell: bash
        run: |
          docker run --rm --network host -w /app/packages/librdkafka autumn:librdkafka-probe \
            bun scripts/probeAddon.ts | tee -a "$GITHUB_STEP_SUMMARY"

  twd:
    name: Publish the addon for twd's Debian base
    # twd's Modal sandboxes run gVisor, where the compile outlives the warm; warmup.sh downloads this by build key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same distro and compiler as scripts/tw/helpers/modalImage.ts, so the build key matches the warm's.
      - name: Build the addon on Debian bookworm
        id: build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/addon"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/addon:/out" debian:bookworm-slim bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl unzip git perl python3 build-essential >/dev/null
            curl -fsSL https://bun.sh/install | bash -s "bun-v$(cat /src/.bun-version)" >/dev/null
            export PATH=/root/.bun/bin:$PATH
            mkdir -p /build/patches /build/packages && cd /build
            cp "/src/patches/@confluentinc%2Fkafka-javascript@1.10.0.patch" patches/
            cp -r /src/packages/librdkafka packages/
            bun -e "await Bun.write(\"package.json\", JSON.stringify({ name: \"librdkafka-build\", private: true, workspaces: [\"packages/librdkafka\"], patchedDependencies: { \"@confluentinc/kafka-javascript@1.10.0\": \"patches/@confluentinc%2Fkafka-javascript@1.10.0.patch\" } }))"
            bun install --ignore-scripts >/dev/null
            key=$(bun run --silent --cwd packages/librdkafka native:key)
            echo "$key" > /out/key
            if curl -fsI "https://github.com/useautumn/autumn/releases/download/librdkafka-addon-$key/$key.node" >/dev/null; then
              echo "addon $key already published"
              exit 0
            fi
            LIBRDKAFKA_CACHE_DIR=/out bun run --cwd packages/librdkafka build
          '
          key=$(cat "$RUNNER_TEMP/addon/key")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/addon/$key.node" ]; then echo "built=true" >> "$GITHUB_OUTPUT"; fi
          echo "twd addon build key: $key" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish it as a release asset
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          key=${{ steps.build.outputs.key }}
          gh release create "librdkafka-addon-$key" "$RUNNER_TEMP/addon/$key.node" \
            --repo "$GITHUB_REPOSITORY" --target "${{ github.event.pull_request.head.sha || github.sha }}" --prerelease \
            --title "librdkafka addon $key" \
            --notes "Prebuilt @confluentinc/kafka-javascript addon for twd warm images (Debian bookworm, build key $key)." \
            || gh release view "librdkafka-addon-$key" --repo "$GITHUB_REPOSITORY" >/dev/null
