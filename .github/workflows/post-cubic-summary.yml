name: Post Cubic Summary to Slack

on:
  pull_request_target:
    types:
      - opened
      - edited
      - closed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-shipped:
    name: Notify shipped
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.body || '', '<!-- This is an auto-generated description by cubic. -->') ||
      contains(github.event.pull_request.body || '', '<!-- greptile_comment -->')) &&
      (github.event.action == 'opened' ||
      (github.event.changes.body &&
      !contains(github.event.changes.body.from || '', '<!-- This is an auto-generated description by cubic. -->') &&
      !contains(github.event.changes.body.from || '', '<!-- greptile_comment -->')))
    concurrency:
      group: shipped-summary-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Post summary to shipped
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::DEPLOY_URL and DEPLOY_SECRET must be configured"
            exit 1
          fi

          if [ "$PR_HEAD_REF" = "dev" ]; then
            route_label="dev2main"
          else
            slack_head_ref=$(printf '%s' "$PR_HEAD_REF" | sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g')
            route_label="$slack_head_ref → main"
          fi

          cubic_start_marker="## Summary by cubic"
          cubic_end_marker="<sup>"
          greptile_start_marker="<!-- greptile_comment -->"
          greptile_summary_marker="</summary>"
          greptile_end_marker="</details>"
          cubic_prefix="${PR_BODY%%"$cubic_start_marker"*}"
          greptile_prefix="${PR_BODY%%"$greptile_start_marker"*}"

          if [ "$cubic_prefix" != "$PR_BODY" ] &&
            { [ "$greptile_prefix" = "$PR_BODY" ] || [ "${#cubic_prefix}" -lt "${#greptile_prefix}" ]; }; then
            summary="${PR_BODY#*"$cubic_start_marker"}"
            summary="${summary%%"$cubic_end_marker"*}"
          else
            greptile_summary="${PR_BODY#*"$greptile_start_marker"}"
            summary="${greptile_summary#*"$greptile_summary_marker"}"

            if [ "$summary" = "$greptile_summary" ]; then
              echo "::error::Greptile summary heading was not found"
              exit 1
            fi

            summary="${summary%%"$greptile_end_marker"*}"
          fi

          slack_summary=$(printf '%s' "$summary" | sed -E \
            -e '1{/^$/d;}' \
            -e 's/\*\*([^*]+)\*\*/\*\1\*/g' \
            -e 's/&/\&amp;/g' \
            -e 's/</\&lt;/g' \
            -e 's/>/\&gt;/g')
          printf -v SLACK_MESSAGE '*%s* :rocket:\n<%s|PR #%s>\n\n%s' \
            "$route_label" "$PR_URL" "$PR_NUMBER" "$slack_summary"
          export PR_URL SLACK_MESSAGE

          node -e 'process.stdout.write(JSON.stringify({ pullRequestUrl: process.env.PR_URL, text: process.env.SLACK_MESSAGE }))' \
            > "$RUNNER_TEMP/shipped-summary-payload.json"

          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-deploy-secret: $DEPLOY_SECRET" \
            --data-binary @"$RUNNER_TEMP/shipped-summary-payload.json" \
            "$DEPLOY_URL/api/shipped/summary"

  wait-for-summary:
    name: Wait for a PR summary
    if: >-
      github.event.action == 'opened' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Wait for a PR summary
        run: sleep 300

  notify-without-summary:
    name: Notify without summary
    needs: wait-for-summary
    if: >-
      github.event.action == 'opened' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: shipped-summary-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Post fallback to shipped
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::DEPLOY_URL and DEPLOY_SECRET must be configured"
            exit 1
          fi

          pr_body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')
          case "$pr_body" in
            *'<!-- This is an auto-generated description by cubic. -->'* | *'<!-- greptile_comment -->'*)
              echo "A shipped message has already been posted"
              exit 0
              ;;
          esac

          if [ "$PR_HEAD_REF" = "dev" ]; then
            route_label="dev2main"
          else
            slack_head_ref=$(printf '%s' "$PR_HEAD_REF" | sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g')
            route_label="$slack_head_ref → main"
          fi

          printf -v SLACK_MESSAGE '*%s* :rocket:\n<%s|PR #%s>' \
            "$route_label" "$PR_URL" "$PR_NUMBER"
          export PR_URL SLACK_MESSAGE

          node -e 'process.stdout.write(JSON.stringify({ pullRequestUrl: process.env.PR_URL, text: process.env.SLACK_MESSAGE }))' \
            > "$RUNNER_TEMP/shipped-summary-payload.json"

          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-deploy-secret: $DEPLOY_SECRET" \
            --data-binary @"$RUNNER_TEMP/shipped-summary-payload.json" \
            "$DEPLOY_URL/api/shipped/summary"

  notify-merged:
    name: Reply when merged
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Reply in shipped thread
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::DEPLOY_URL and DEPLOY_SECRET must be configured"
            exit 1
          fi

          export MERGED_AT MERGE_COMMIT_SHA PR_URL
          node -e 'process.stdout.write(JSON.stringify({ pullRequestUrl: process.env.PR_URL, mergedAt: process.env.MERGED_AT, mergeCommitSha: process.env.MERGE_COMMIT_SHA }))' \
            > "$RUNNER_TEMP/shipped-merge-payload.json"

          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-deploy-secret: $DEPLOY_SECRET" \
            --data-binary @"$RUNNER_TEMP/shipped-merge-payload.json" \
            "$DEPLOY_URL/api/shipped/merge"

      - name: Maybe celebrate with Honest Burgers
        if: ${{ !cancelled() }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          SLACK_SHIPPED_WEBHOOK_URL: ${{ secrets.SLACK_SHIPPED_WEBHOOK_URL }}
        run: |
          if [ "$(node -e 'process.stdout.write(String(require("node:crypto").randomInt(100)))')" -ge 5 ]; then
            echo "No Honest Burgers trip for this merge"
            exit 0
          fi

          if [ -z "$SLACK_SHIPPED_WEBHOOK_URL" ]; then
            echo "::error::SLACK_SHIPPED_WEBHOOK_URL is not configured"
            exit 1
          fi

          export PR_URL
          node -e 'process.stdout.write(JSON.stringify({ text: "🍔🎉 Please schedule an Honest Burgers trip to celebrate this release! 🎊🚀\n" + process.env.PR_URL }))' \
            > "$RUNNER_TEMP/honest-burgers-payload.json"

          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/honest-burgers-payload.json" \
            "$SLACK_SHIPPED_WEBHOOK_URL"
