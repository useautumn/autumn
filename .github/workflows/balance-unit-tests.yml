name: Balance Unit Tests

on:
  pull_request:
    paths:
      - "apps/balance-worker/**"
      - "packages/balance-engine/**"
      - "packages/balance-worker-client/**"
      - "packages/env/**"
      - "packages/kafka/**"
      - "scripts/devServices/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/balance-unit-tests.yml"
  push:
    branches: [dev]
    paths:
      - "apps/balance-worker/**"
      - "packages/balance-engine/**"
      - "packages/balance-worker-client/**"
      - "packages/env/**"
      - "packages/kafka/**"
      - "scripts/devServices/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/balance-unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: balance-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: peak-ubuntu-24.04-4
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run balance engine unit tests
        run: bun -F @autumn/balance-engine test:unit

      - name: Run kafka unit tests
        run: bun -F @autumn/kafka test:unit

      - name: Run balance worker unit tests
        run: bun -F @autumn/balance-worker test:unit

      - name: Run client and environment unit tests
        run: |
          bun -F @autumn/balance-worker-client test
          bun -F @autumn/env test

      - name: Run balance engine type check
        run: bun -F @autumn/balance-engine ts

      - name: Run kafka type check
        run: bun -F @autumn/kafka ts

      - name: Run balance worker type check
        run: bun -F @autumn/balance-worker ts

      - name: Run client and environment type checks
        run: |
          bun -F @autumn/balance-worker-client ts
          bun -F @autumn/env ts

  kafka-integration-tests:
    name: Kafka Integration Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      KAFKA_TEST_COMPOSE_FILE: apps/balance-worker/tests/integration/kafka/compose.yml
      # The single-broker compose stack advertises its HOST listener here; the
      # test runner refuses to start services itself, so CI provides the address.
      KAFKA_BROKERS: 127.0.0.1:19092

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Kafka and S3 test services
        run: docker compose -f "$KAFKA_TEST_COMPOSE_FILE" up -d --wait --wait-timeout 120

      - name: Run balance worker Kafka integration tests
        run: bun -F @autumn/balance-worker test:kafka

      - name: Show test service logs
        if: failure()
        run: docker compose -f "$KAFKA_TEST_COMPOSE_FILE" logs --tail 200

      - name: Stop test services
        if: always()
        run: docker compose -f "$KAFKA_TEST_COMPOSE_FILE" down -v --remove-orphans
