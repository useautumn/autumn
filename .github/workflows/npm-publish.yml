name: NPM Publish (reusable)

on:
  workflow_call:
    inputs:
      package-dir:
        description: "Workspace path, e.g. packages/autumn-js"
        required: true
        type: string
      tag-prefix:
        description: "Git tag prefix (<prefix>-v* tags); defaults to the package-dir basename"
        required: false
        default: ""
        type: string
      pre-build-command:
        description: "Optional command run before build (e.g. SDK regeneration)"
        required: false
        default: ""
        type: string
      install-speakeasy:
        description: "Install the Speakeasy CLI before pre-build"
        required: false
        default: false
        type: boolean
      build-command:
        description: "Build command override; defaults to the package's `build` script"
        required: false
        default: ""
        type: string
      typecheck-command:
        description: "Typecheck command override; defaults to the package's `ts` script when present"
        required: false
        default: ""
        type: string
      test-command:
        description: "Test command override; defaults to the package's `test` script when present"
        required: false
        default: ""
        type: string
      dry-run:
        description: "'true' to npm publish --dry-run"
        required: false
        default: "false"
        type: string
      publish-name-override:
        description: "Publish under this name instead (test packages); skips git tagging"
        required: false
        default: ""
        type: string
    secrets:
      SPEAKEASY_API_KEY:
        required: false

jobs:
  publish:
    name: Build and Publish
    # GitHub-hosted: npm --provenance rejects self-hosted/Blacksmith runners
    runs-on: ubuntu-latest

    concurrency:
      group: npm-publish-${{ inputs.publish-name-override || inputs.package-dir }}
      queue: max
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: write

    env:
      # tsup's dts worker hits Node's default heap cap; runner has 16 GB
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve package
        id: pkg
        run: |
          NAME=$(jq -r '.name' ${{ inputs.package-dir }}/package.json)
          TAG_PREFIX="${{ inputs.tag-prefix }}"
          if [ -z "$TAG_PREFIX" ]; then TAG_PREFIX=$(basename "${{ inputs.package-dir }}"); fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "tag_prefix=$TAG_PREFIX" >> $GITHUB_OUTPUT
          echo "Package: $NAME (tags: ${TAG_PREFIX}-v*)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node.js (for npm OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5.1 for OIDC trusted publishing
        run: |
          echo "Current npm version: $(npm --version)"
          npm install -g npm@11
          echo "Updated npm version: $(npm --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Speakeasy CLI
        if: inputs.install-speakeasy
        run: |
          curl -fsSL https://go.speakeasy.com/cli-install.sh | sh
          echo "$HOME/.speakeasy/bin" >> $GITHUB_PATH
          echo "Speakeasy CLI version: $($HOME/.speakeasy/bin/speakeasy --version)"

      - name: Resolve version from npm
        id: next-version
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          TAG_PREFIX: ${{ steps.pkg.outputs.tag_prefix }}
          PUBLISH_NAME_OVERRIDE: ${{ inputs.publish-name-override }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: bun scripts/release/prepareNpmRelease.ts

      - name: Update package.json version
        if: steps.next-version.outputs.published != 'true'
        run: |
          cd ${{ inputs.package-dir }}
          jq --arg version "${{ steps.next-version.outputs.version }}" --arg sha "$GITHUB_SHA" \
             '.version = $version | .gitHead = $sha' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Updated package.json:"
          head -10 package.json

      # Command inputs are passed through env vars (not interpolated into the
      # script) per GitHub's shell-injection hardening guidance.
      - name: Pre-build
        if: steps.next-version.outputs.published != 'true' && inputs.pre-build-command != ''
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          COMMAND: ${{ inputs.pre-build-command }}
        run: eval "$COMMAND"

      - name: Build
        if: steps.next-version.outputs.published != 'true'
        env:
          COMMAND: ${{ inputs.build-command }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          if [ -n "$COMMAND" ]; then
            eval "$COMMAND"
          else
            bun -F "$PKG_NAME" build
          fi

      - name: TypeScript check
        if: steps.next-version.outputs.published != 'true'
        env:
          COMMAND: ${{ inputs.typecheck-command }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          if [ -n "$COMMAND" ]; then
            eval "$COMMAND"
          elif jq -e '.scripts.ts' ${{ inputs.package-dir }}/package.json > /dev/null; then
            bun -F "$PKG_NAME" ts
          else
            echo "No ts script, skipping"
          fi

      - name: Tests
        if: steps.next-version.outputs.published != 'true'
        env:
          COMMAND: ${{ inputs.test-command }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          if [ -n "$COMMAND" ]; then
            eval "$COMMAND"
          elif jq -e '.scripts.test' ${{ inputs.package-dir }}/package.json > /dev/null; then
            bun -F "$PKG_NAME" test
          else
            echo "No test script, skipping"
          fi

      - name: Prepare manifest for publish
        if: steps.next-version.outputs.published != 'true'
        run: |
          cd ${{ inputs.package-dir }}
          # Built artifacts need neither workspace-only dependencies nor prepublish hooks.
          if [ -n "${{ inputs.publish-name-override }}" ]; then
            jq --arg name "${{ inputs.publish-name-override }}" \
               '.name = $name | del(.devDependencies) | del(.scripts.prepublishOnly)' \
               package.json > package.json.tmp
          else
            jq 'del(.devDependencies) | del(.scripts.prepublishOnly)' \
               package.json > package.json.tmp
          fi
          mv package.json.tmp package.json
          echo "Publishing as: $(jq -r '"\(.name)@\(.version)"' package.json)"

      - name: Publish (dry-run)
        if: steps.next-version.outputs.published != 'true' && inputs.dry-run == 'true'
        run: |
          cd ${{ inputs.package-dir }}
          npm publish --dry-run --provenance --access public
          echo "✅ Dry run completed successfully"

      - name: Publish to npm
        if: steps.next-version.outputs.published != 'true' && inputs.dry-run != 'true'
        run: |
          cd ${{ inputs.package-dir }}
          npm publish --provenance --access public
          echo "✅ Published $(jq -r '.name' package.json)@${{ steps.next-version.outputs.version }}"

      - name: Create git tag
        if: inputs.dry-run != 'true' && inputs.publish-name-override == ''
        run: |
          TAG_NAME="${{ steps.pkg.outputs.tag_prefix }}-v${{ steps.next-version.outputs.version }}"
          if git rev-parse --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG_NAME^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG_NAME" "$GITHUB_SHA"
          fi
          git push origin "$TAG_NAME"
          echo "✅ Created and pushed tag: $TAG_NAME"

      - name: Summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.publish-name-override }}" ]; then
            echo "| Package | ${{ inputs.publish-name-override }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Package | ${{ steps.pkg.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Version | ${{ steps.next-version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Already published | ${{ steps.next-version.outputs.published }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dry-run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
