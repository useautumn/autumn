"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Replaces the legacy .conductor/config.json — Conductor prefers this file when
# both exist. Same setup/run/teardown, plus a docker-daemon start that a fresh
# workspace needs (the snapshot carries images, not a running daemon).

[scripts]
setup = "bash .conductor/setup.sh"
archive = "bun dw teardown"
run_mode = "concurrent"

[scripts.run.dev]
command = "bun dw run"
default = true
icon = "play"
