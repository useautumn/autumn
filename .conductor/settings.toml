"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Replaces the legacy .conductor/config.json — Conductor prefers this file when
# both exist. Same setup/run/teardown, plus a docker-daemon start that a fresh
# workspace needs (the snapshot carries images, not a running daemon).

[scripts]
setup = "bash .conductor/setup.sh"
archive = "bun dw teardown"
run_mode = "concurrent"

# Conductor writes an untracked settings.local.toml that shadows `scripts.setup`
# above, so setup.sh never runs. Settings replace per key, and the local file
# defines only `setup` — this stays ours, so provisioning lives in workspace.sh.
[scripts.run.dev]
command = "bash .conductor/workspace.sh"
default = true
icon = "play"
