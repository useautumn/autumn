<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22#fff%22/%3E%3Cg transform=%22translate(-5 3) rotate(30 32 32)%22%3E%3Cpath d=%22M22 9h20M26 9v29a6 6 0 0 0 12 0V9%22 fill=%22none%22 stroke=%22#000%22 stroke-width=%225%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M26 27h12v11a6 6 0 0 1-12 0z%22 fill=%22#000%22/%3E%3C/g%3E%3Ccircle cx=%2245%22 cy=%2250%22 r=%223.4%22 fill=%22#000%22/%3E%3Ccircle cx=%2251%22 cy=%2242%22 r=%222.3%22 fill=%22#000%22/%3E%3C/svg%3E" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>twd</title>
		<script>
			(() => {
				const stored = localStorage.getItem("twd-theme");
				const dark =
					stored === "dark" ||
					(stored !== "light" &&
						matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
